<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spice Race — Prototype 0.1</title>
<style>
:root{
  --bg:#f4efe4; --paper:#fffdf7; --ink:#201d18; --muted:#6b6255;
  --line:#d8cdbb; --accent:#7b4f24; --good:#2e6b4f; --warn:#9a5b14; --bad:#8a3434;
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:auto;padding:24px}
.header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{margin:.1rem 0;font-size:clamp(2rem,6vw,4rem);letter-spacing:.03em}
.subtitle{color:var(--muted);font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin:18px 0}
.stat{background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:10px}
.stat b{display:block;font-size:1.35rem}
.progress{height:10px;border-radius:10px;background:#e2d8c8;overflow:hidden;margin:8px 0 22px}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:bold}
h2{font-size:1.65rem;margin:.35rem 0 .7rem}
p,li{font-size:1.05rem;line-height:1.55}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;padding:13px 14px;border-radius:10px;border:1px solid #b9aa95;background:#f8f2e8;color:var(--ink);cursor:pointer;text-align:left}
button:hover{border-color:var(--accent)}
button:focus{outline:3px solid #d6b88f;outline-offset:2px}
button.primary{background:var(--accent);color:white;border-color:var(--accent);text-align:center}
button.secondary{text-align:center}
button:disabled{opacity:.55;cursor:not-allowed}
.event{border-left:5px solid var(--accent);padding-left:14px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;margin:2px 3px;font-size:.85rem;background:#faf6ed}
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center;margin:16px 0}
.route div{padding:9px 6px;text-align:center;background:#f5efe5;border:1px solid var(--line);border-radius:9px;font-size:.86rem}
.arrow{text-align:center;color:var(--muted)}
textarea,input[type="text"]{width:100%;font:inherit;font-size:1rem;padding:12px;border:1px solid #b9aa95;border-radius:9px;background:white}
textarea{min-height:105px;resize:vertical}
.small{font-size:.9rem;color:var(--muted)}
.hidden{display:none}
.debrief{border:2px solid var(--accent)}
table{width:100%;border-collapse:collapse;margin:12px 0}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
th:last-child,td:last-child{text-align:right}
@media(max-width:700px){
  .stats{grid-template-columns:1fr 1fr}.choice-grid{grid-template-columns:1fr}.route{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}
}
</style>
</head>
<body>
<main>
<div class="header">
  <div>
    <div class="kicker">Partner Simulation • Prototype 0.1</div>
    <h1>The Spice Race</h1>
    <div class="subtitle">Europe, trade, competition, and the road to empire</div>
  </div>
  <div class="small">Work with your partner. Discuss every choice before clicking.</div>
</div>

<div class="stats" aria-live="polite">
  <div class="stat">💰 Treasury<b id="treasury">100</b></div>
  <div class="stat">📦 Trade Access<b id="trade">10</b></div>
  <div class="stat">👑 Power<b id="power">10</b></div>
  <div class="stat">⚖️ Human Cost<b id="human">0</b></div>
</div>
<div class="progress"><span id="bar"></span></div>

<section id="screen" class="card"></section>
<section id="log" class="card hidden"><div class="kicker">Your decisions</div><div id="logText"></div></section>
</main>
<script>
(function(){
const root=document;
const s={step:0,treasury:100,trade:10,power:10,human:0,knowledge:0,choices:[],reflection:""};
const el=id=>root.getElementById(id);
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function update(){
  el("treasury").textContent=s.treasury;
  el("trade").textContent=s.trade;
  el("power").textContent=s.power;
  el("human").textContent=s.human;
  el("bar").style.width=(s.step/12*100)+"%";
}
function log(t){s.choices.push(t);el("log").classList.remove("hidden");el("logText").innerHTML=s.choices.map((x,i)=>"<p><b>"+(i+1)+".</b> "+x+"</p>").join("")}
function set(html){el("screen").innerHTML=html;update();wire()}
function btn(id,fn){const b=el(id); if(b)b.addEventListener("click",fn)}
function next(){s.step++; render()}
function consequence(msg,delta,choice){
  if(delta){s.treasury+=delta.t||0;s.trade=clamp(s.trade+(delta.tr||0),0,100);s.power=clamp(s.power+(delta.p||0),0,100);s.human=clamp(s.human+(delta.h||0),0,100)}
  log(choice);
  set('<div class="kicker">Consequence</div><h2>'+msg.title+'</h2><p>'+msg.body+'</p><p class="small">'+msg.note+'</p><button id="continue" class="primary">Continue →</button>');
  btn("continue",next)
}
function wire(){
  btn("start",next);
}
function render(){
update();
if(s.step===0){
set(`<div class="kicker">Mission briefing • 1450</div>
<h2>You advise an ambitious European ruler.</h2>
<p>Europe is recovering from centuries of political fragmentation and conflict. Population and trade are growing again. Wealthy buyers want luxuries from faraway markets.</p>
<p><b>Your mission:</b> turn 100 ducats into wealth and power. You and your partner must agree on every major decision.</p>
<div class="event"><p><b>Rule:</b> There may not be one “correct” choice. History is shaped by incentives, limits, accidents, geography, and human decisions.</p></div>
<button id="start" class="primary">Begin the campaign</button>`);
return}

if(s.step===1){
set(`<div class="kicker">Phase 1 • Political world</div>
<h2>Europe did not go directly from Rome to modern countries.</h2>
<p>Put these developments in the order you think makes the most sense. Discuss first; then choose the best sequence.</p>
<div class="choice-grid">
<button id="q1">A. Western Rome falls → fragmented kingdoms → larger kingdoms consolidate → stronger states compete</button>
<button id="q2">B. Strong modern nations → Western Rome falls → Byzantine Empire begins → Charlemagne</button>
<button id="q3">C. Charlemagne → Roman Republic → Islam → Western Rome falls</button>
</div>`);
btn("q1",()=>consequence({title:"Good historical frame.",body:"After the western Roman imperial system collapsed, political authority fragmented. Over centuries, new kingdoms and empires rose, fell, merged, and competed. The eastern Roman/Byzantine Empire continued for roughly another thousand years.",note:"Keep this idea: political borders are temporary; power reorganizes."},{p:5},"Built a correct political sequence."));
btn("q2",()=>consequence({title:"Not quite.",body:"Modern national borders come much later. Western Rome’s collapse produced fragmentation rather than modern states appearing immediately.",note:"Your kingdom loses time sorting out the chronology."},{t:-3},"Misread the political sequence, then corrected it."));
btn("q3",()=>consequence({title:"Chronology trouble.",body:"Charlemagne lived centuries after the Roman Republic. Islam emerged in the 600s CE, after the western Roman Empire had fallen.",note:"History is easier when you build a chronological spine first."},{t:-4},"Had to repair the chronology."));
return}

if(s.step===2){
set(`<div class="kicker">Phase 1 • Stability</div>
<h2>Your kingdom finally has several decades of relative peace.</h2>
<p>Roads are safer. Harvests are more predictable. Population is growing. Merchants are returning.</p>
<p>Which outcome is <b>most likely</b>?</p>
<div class="choice-grid">
<button id="a">People stop trading because peace removes the need for goods.</button>
<button id="b">Trade grows because risk falls and people have more resources to spend.</button>
<button id="c">Prices of every good automatically fall to zero.</button>
<button id="d">Nothing changes; politics has no relationship to economics.</button>
</div>`);
btn("b",()=>consequence({title:"Stability creates opportunity.",body:"When merchants expect roads, laws, currencies, and governments to remain usable, trade becomes less risky. Growing wealth also creates more demand for nonessential goods.",note:"Stability does not guarantee prosperity, but predictability can lower risk."},{t:8,tr:8,p:3},"Used political stability to expand trade."));
["a","c","d"].forEach(id=>btn(id,()=>consequence({title:"Your merchants disagree.",body:"Political stability does not magically create wealth, but predictable rules and safer movement can make trade and investment more attractive. Instability raises risk and can disrupt supply.",note:"Your advisers revise the plan."},{t:-5,tr:2},"Underestimated the economic value of stability.")));
return}

if(s.step===3){
set(`<div class="kicker">Phase 2 • The luxury market</div>
<h2>A merchant arrives with pepper, silk, perfumes, and precious stones.</h2>
<p>Wealthy European customers are willing to pay extremely high prices for Asian luxuries.</p>
<table><tr><th>Good</th><th>Approx. source cost</th><th>European sale price</th></tr>
<tr><td>Pepper</td><td>8</td><td>30</td></tr><tr><td>Silk</td><td>15</td><td>48</td></tr><tr><td>Perfume ingredients</td><td>12</td><td>37</td></tr></table>
<p>You have 108–116 ducats depending on earlier choices. What is the strongest economic question?</p>
<div class="choice-grid"><button id="why">Why is the European price so much higher?</button><button id="ban">Should we ban luxury goods?</button><button id="free">Can we demand merchants sell them at the Asian price?</button><button id="ignore">Ignore the market.</button></div>`);
btn("why",()=>consequence({title:"Investigate the supply chain.",body:"Excellent. A large price difference can signal costs, scarcity, risk, market power, or profit somewhere between producer and buyer.",note:"Next: follow the pepper."},{tr:5},"Asked where the price difference comes from."));
["ban","free","ignore"].forEach(id=>btn(id,()=>consequence({title:"The demand does not disappear.",body:"Wealthy buyers still want the goods. The better business question is why the final price is so different from the price closer to production.",note:"Demand creates an incentive for someone to find a profitable supply."},{t:-4},"Tried to avoid the price problem before investigating it.")));
return}

if(s.step===4){
set(`<div class="kicker">Phase 2 • Follow the pepper</div>
<h2>How does an 8-ducat product become a 30-ducat product?</h2>
<div class="route"><div>South & East Asian producers<br><b>8</b></div><div class="arrow">→</div><div>Regional merchants<br><b>+5</b></div><div class="arrow">→</div><div>Overland/sea transport<br><b>+6</b></div></div>
<div class="route"><div>Taxes, tolls & risk<br><b>+4</b></div><div class="arrow">→</div><div>Mediterranean merchants<br><b>+4</b></div><div class="arrow">→</div><div>European market<br><b>27+</b></div></div>
<p>Choose the best explanation.</p>
<div class="choice-grid"><button id="cost">Every stage adds costs and often a profit margin. Distance and risk matter.</button><button id="magic">European merchants simply invent a random price.</button><button id="supply">Only demand matters; supply and transport do not.</button><button id="cheap">Long-distance trade should always make goods cheaper.</button></div>`);
btn("cost",()=>consequence({title:"You found the economic engine.",body:"Long supply chains can accumulate transportation costs, losses, duties, tolls, financing costs, and merchant markups. High demand at the destination can make the trade profitable despite those costs.",note:"This is the problem European merchants and rulers want to solve."},{t:12,tr:8},"Explained how trade costs accumulate."));
["magic","supply","cheap"].forEach(id=>btn(id,()=>consequence({title:"Recalculate.",body:"The price reflects more than greed or one single cause. Goods cross long distances through multiple commercial and political systems, with costs and risks added along the way.",note:"Your treasury absorbs the mistake."},{t:-7},"Misread the long-distance supply chain.")));
return}

if(s.step===5){
set(`<div class="kicker">Phase 3 • Trade and power</div>
<h2>1453: Constantinople changes hands.</h2>
<p>The Ottoman Empire captures Constantinople, ending the Byzantine Empire. The city remains a major commercial center, but the political balance around eastern Mediterranean trade has changed.</p>
<p>Your merchants fear war, changing tolls, diplomatic problems, and dependence on powers they do not control.</p>
<div class="choice-grid"><button id="deal">Negotiate and keep using existing trade networks.</button><button id="route">Invest in finding a sea route that gives you more direct access.</button><button id="war">Declare a giant war immediately.</button><button id="both">Keep trading while secretly funding route research.</button></div>`);
btn("deal",()=>consequence({title:"Diplomacy keeps goods moving.",body:"Commerce often continues even between political and religious rivals because both sides benefit. But your kingdom remains dependent on existing routes and intermediaries.",note:"Trade and conflict can exist at the same time."},{t:8,tr:6,p:2},"Chose diplomacy and continued trade."));
btn("route",()=>consequence({title:"High risk, high reward.",body:"A direct maritime route could reduce dependence on some intermediaries and create enormous strategic advantage. It will require ships, navigation knowledge, capital, and luck.",note:"Exploration is an investment, not a spontaneous adventure."},{t:-20,tr:10,p:7},"Funded research for a direct sea route."));
btn("both",()=>consequence({title:"Hedge your bets.",body:"You preserve current income while investing in a possible alternative. It costs more now, but reduces the danger of betting everything on one route.",note:"States often pursue several strategies at once."},{t:-12,tr:12,p:5},"Maintained trade while funding exploration."));
btn("war",()=>consequence({title:"War is expensive.",body:"Your kingdom lacks the resources to conquer the entire eastern Mediterranean commercial system. Military spending drains your treasury and disrupts your own trade.",note:"Power has costs."},{t:-25,tr:-5,p:2,h:6},"Tried to solve a trade problem with immediate war."));
return}

if(s.step===6){
set(`<div class="kicker">Phase 3 • Portugal moves</div>
<h2>Intelligence report: Portuguese expeditions are pushing farther down Africa.</h2>
<p>If Portugal reaches Indian Ocean markets by sea, it could gain a major commercial advantage.</p>
<p>Your ruler asks: <b>What do competitors do when another country may control a profitable route?</b></p>
<div class="choice-grid"><button id="copy">Copy the same strategy and race Portugal around Africa.</button><button id="west">Fund a risky proposal to sail west toward Asia.</button><button id="wait">Wait and buy from Portugal later.</button><button id="spy">Gather information before choosing.</button></div>`);
btn("copy",()=>consequence({title:"Competition intensifies.",body:"Copying a rival can work, but Portugal has a head start and knowledge built from decades of Atlantic and African voyages.",note:"A competitor's advantage can push others toward different strategies."},{t:-18,tr:8,p:5},"Tried to race Portugal on the African route."));
btn("west",()=>consequence({title:"A dangerous alternative.",body:"Sailing west is a gamble. Europeans know Earth is spherical, but estimates of the distance to Asia vary badly. A western expedition could run out of food long before reaching Asia.",note:"Your ruler must decide whether the possible reward justifies the risk."},{t:-22,tr:8,p:8},"Funded a western route gamble."));
btn("wait",()=>consequence({title:"Safe now, weaker later.",body:"You conserve cash, but if Portugal controls a route, it can shape prices and access. Dependence on a rival creates strategic vulnerability.",note:"Doing nothing is still a decision."},{t:3,tr:-5,p:-3},"Waited for Portugal to control the route."));
btn("spy",()=>consequence({title:"Information has value.",body:"You learn Portugal is investing heavily in navigation and Atlantic experience. You still need to choose a strategy soon.",note:"Knowledge reduces uncertainty but cannot eliminate risk."},{t:-5,p:4},"Paid for intelligence on Portuguese exploration."));
return}

if(s.step===7){
set(`<div class="kicker">Phase 4 • 1492</div>
<h2>A westward expedition reaches inhabited lands across the Atlantic.</h2>
<p>The expedition has <b>not</b> reached Asia. Millions of Indigenous people already live throughout the Americas in complex societies.</p>
<p>Your ruler asks what to do next.</p>
<div class="choice-grid"><button id="tradepeace">Trade and establish diplomatic relationships.</button><button id="claim">Claim territory for the crown and seek resources.</button><button id="mission">Prioritize missionary activity and alliance-building.</button><button id="extract">Use force to seize wealth and labor.</button></div>`);
btn("tradepeace",()=>consequence({title:"Commerce without immediate conquest.",body:"Trade can create exchange and alliances, but relationships remain unequal if backed by military power or claims Europeans make without Indigenous consent.",note:"Peaceful intentions do not erase conflicting claims to land and sovereignty."},{t:14,tr:10,p:4,h:3},"Pursued trade and diplomacy in the Americas."));
btn("claim",()=>consequence({title:"Trade begins turning into empire.",body:"Territorial claims can give a state access to land, ports, and resources, but they collide with the sovereignty and lives of people already there.",note:"Economic competition increasingly becomes political control."},{t:18,tr:12,p:15,h:18},"Claimed territory and resources."));
btn("mission",()=>consequence({title:"Religion and power overlap.",body:"Missionaries may be motivated by sincere faith, while rulers may also see religion as tied to legitimacy, alliances, and imperial expansion. These motives can reinforce each other.",note:"Avoid reducing religion to either pure faith or pure excuse."},{t:7,p:10,h:8},"Used religion and alliances as part of expansion."));
btn("extract",()=>consequence({title:"Rapid wealth, severe human consequences.",body:"Violence and coerced labor can enrich conquerors and states while devastating Indigenous communities. Systems may reward actions that impose enormous costs on other people.",note:"Watch what happens to your score."},{t:35,tr:15,p:20,h:35},"Used coercion to seize wealth and labor."));
return}

if(s.step===8){
set(`<div class="kicker">Phase 4 • 1498</div>
<h2>Vasco da Gama reaches India by sea.</h2>
<p>Portugal now has a maritime route from Europe around Africa into the Indian Ocean trading world.</p>
<p>What does this change most directly?</p>
<div class="choice-grid"><button id="direct">European states now have another way to reach Asian markets and compete over trade.</button><button id="allold">All older trade networks instantly disappear.</button><button id="peace">Competition for trade ends permanently.</button><button id="none">Nothing important changes.</button></div>`);
btn("direct",()=>consequence({title:"A new route changes the competition.",body:"Older routes continue, but oceanic connections give European states new opportunities to enter, disrupt, and eventually dominate parts of existing trading systems.",note:"New routes add competition; they do not erase history overnight."},{tr:15,p:8},"Recognized the significance of the sea route to India."));
["allold","peace","none"].forEach(id=>btn(id,()=>consequence({title:"Too absolute.",body:"Existing Asian, African, Middle Eastern, and Mediterranean trade systems continued. The new European sea route altered competition rather than instantly replacing the old world economy.",note:"Historical change is usually layered, not an on/off switch."},{tr:2},"Overstated what the new sea route changed immediately.")));
return}

if(s.step===9){
set(`<div class="kicker">Phase 5 • Build the chain</div>
<h2>Partner challenge: explain how pepper can lead to empire.</h2>
<p>Before clicking, say the chain out loud to your partner. Then choose the strongest causal sequence.</p>
<div class="choice-grid">
<button id="chain">Demand for Asian luxuries → profitable but costly trade → search for alternate routes → competition among states → naval expansion → control of ports/resources/territory → colonial empires</button>
<button id="random">Pepper → Columbus randomly sails → everyone decides to colonize</button>
<button id="religion">Religion alone → exploration → trade appears afterward</button>
<button id="tech">Technology alone → ships → empire, with economics and politics mostly irrelevant</button>
</div>`);
btn("chain",()=>consequence({title:"You found the spine of the unit.",body:"No single factor explains European expansion. Demand, commerce, state competition, religion, navigation, military power, geography, and contingency interact.",note:"Now explain it in your own words."},{p:10,tr:10},"Built the causal chain from trade to empire."));
["random","religion","tech"].forEach(id=>btn(id,()=>consequence({title:"Too simple.",body:"Single-cause explanations are tempting, but they hide the interaction among economics, politics, religion, technology, and geography.",note:"Historical reasoning means connecting several causes."},{p:-2},"Rejected a single-cause explanation after reconsidering.")));
return}

if(s.step===10){
set(`<div class="kicker">Individual thinking • 3 minutes</div>
<h2>Write before you talk.</h2>
<p>Each partner should silently draft an answer on paper or in your class notes:</p>
<div class="event"><p><b>Prompt:</b> Why would European rulers risk money and lives trying to find new routes to Asian markets? Use at least three ideas from the simulation.</p></div>
<p class="small">Do not ask your teacher whether your answer is “right.” Use evidence from your decisions.</p>
<button id="donewrite" class="primary">Both partners have written →</button>`);
btn("donewrite",()=>next());
return}

if(s.step===11){
set(`<div class="kicker">Partner debrief • 5 minutes</div>
<h2>Did you actually “win”?</h2>
<p>Your campaign finished with:</p>
<p><span class="tag">Treasury ${s.treasury}</span><span class="tag">Trade ${s.trade}/100</span><span class="tag">Power ${s.power}/100</span><span class="tag">Human Cost ${s.human}/100</span></p>
<p>Discuss:</p>
<ol><li>Which decision made you richer?</li><li>Which decision increased your political power?</li><li>Who paid the cost for your success?</li><li>Can a country become richer while making the world worse for other people?</li></ol>
<label for="reflect"><b>As partners, write one sentence that explains the biggest lesson of the game:</b></label>
<textarea id="reflect" maxlength="500"></textarea>
<button id="finish" class="primary">Finish campaign</button>`);
btn("finish",()=>{s.reflection=(el("reflect").value||"").trim();s.step++;render()});
return}

if(s.step===12){
let band=s.human>=30?"Your kingdom gained power at a severe human cost.":s.human>=15?"Your kingdom gained power with substantial human consequences.":"Your kingdom limited some direct human costs, though European expansion still affected societies whose land and sovereignty Europeans challenged.";
set(`<div class="kicker">Campaign complete</div><h2>The game you played was a model of history.</h2>
<p>You began with political stabilization and consumer demand. You encountered long-distance trade costs, strategic dependence, Ottoman power, Portuguese exploration, Spanish competition, Atlantic expansion, and the beginnings of colonial empire.</p>
<div class="card debrief"><h2>Final result</h2>
<p><b>Treasury:</b> ${s.treasury} &nbsp; <b>Trade:</b> ${s.trade}/100 &nbsp; <b>Power:</b> ${s.power}/100 &nbsp; <b>Human Cost:</b> ${s.human}/100</p>
<p>${band}</p></div>
<p><b>Your sentence:</b> ${s.reflection?s.reflection.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])):"(No response entered.)"}</p>
<h2>Exit ticket</h2>
<p>On your own paper or in the form your teacher provides, answer:</p>
<ol><li>Why were Asian luxury goods expensive in Europe?</li><li>How can political stability or instability affect trade?</li><li>How did competition between European states encourage exploration?</li><li>Explain the chain from European demand for Asian goods to colonial expansion.</li></ol>
<button id="restart" class="secondary">Restart simulation</button>`);
btn("restart",()=>{s.step=0;s.treasury=100;s.trade=10;s.power=10;s.human=0;s.choices=[];s.reflection="";el("log").classList.add("hidden");render()});
return}
}
render();
})();
</script>
</body>
</html>
